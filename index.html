<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch Busters | Select Your Level</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#f5faff;background:#07091c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#231257 0%,#090b23 58%,#040511 100%)}.wrap{max-width:1100px;margin:auto;padding:22px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#8cefff;text-decoration:none;border:1px solid #24c9f4;padding:9px 15px;border-radius:8px;background:#101638}.back:hover{background:#1b3156}.brand{text-align:center;margin:22px 0 10px;font-weight:1000;font-size:clamp(2.1rem,7vw,5.4rem);line-height:1;letter-spacing:1px;color:#63edff;text-shadow:0 0 10px #008eff,4px 4px #ae21fc}.brand span{color:#ffcd36;text-shadow:0 0 12px #ff5a00,4px 4px #a30bd8}.subtitle{text-align:center;letter-spacing:.22em;font-size:clamp(.8rem,2.3vw,1.25rem);color:#fff}.choose{text-align:center;color:#67f4ff;letter-spacing:.2em;margin:24px 0}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.level{position:relative;min-height:225px;border:3px solid #a82cff;border-radius:15px;background:linear-gradient(160deg,#27115a,#091c4a 58%,#190e36);box-shadow:0 0 14px #802aff88,inset 0 0 18px #4f31c766;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:19px 10px 13px;overflow:hidden}.level:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 20%,#38c8ff3a,transparent 48%),repeating-linear-gradient(0deg,transparent 0 18px,#73dcff0a 19px 20px);pointer-events:none}.level>*{position:relative}.level.live{border-color:#36ecf4;box-shadow:0 0 18px #14d6f499,inset 0 0 22px #26c8ff33}.mark{font-size:clamp(1.1rem,3vw,2rem);font-weight:1000;line-height:1.05;text-align:center;color:#5ff3ff;text-shadow:2px 2px #b12aff}.mark b{color:#ffc742}.number{font-weight:900;font-size:1.35rem;text-shadow:0 0 8px #08baff}.lock{font-size:4rem;filter:drop-shadow(0 0 12px #5bbdff)}.play,.locked{display:block;text-align:center;text-decoration:none;width:95%;padding:12px 5px;border-radius:8px;font-weight:1000;letter-spacing:.05em}.play{color:#142200;background:linear-gradient(#caff4d,#73f200);box-shadow:0 0 13px #7cff00;transition:transform .15s}.play:hover,.play:focus-visible{transform:scale(1.04)}.locked{background:#85889b;color:#1e2033}.footer{text-align:center;margin-top:24px;color:#a6b8df}.art-credit{opacity:.75;font-size:.75rem;text-align:center;margin-top:10px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.levels{gap:10px}.level{min-height:180px;padding:12px 5px 9px}.lock{font-size:2.7rem}.number{font-size:1rem}.play,.locked{font-size:.72rem;padding:10px 2px}.mark{font-size:.94rem}.wrap{padding:15px 9px 35px}}@media(max-width:370px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><main class="wrap"><div class="top"><a class="back" href="javascript:history.length>1?history.back():void(0)" id="back">← Back to CoxArcade</a><span aria-label="CoxArcade">🎮 COXARCADE</span></div><h1 class="brand">GLITCH<span>BUSTERS</span></h1><div class="subtitle">THE BROKEN ARCADE</div><h2 class="choose">SELECT YOUR LEVEL</h2><section class="levels" id="levels" aria-label="Game levels"></section><p class="footer" id="status"></p></main>
<script>
// UNLOCK NEW LEVELS HERE. Replace null with the published game's URL.
const LEVEL_URLS = [
  'https://coxarcade.github.io/questforge-glitch-busters/', // Level 1
  null, // Level 2
  null, // Level 3
  null, // Level 4
  null, // Level 5
  null, // Level 6
  null, // Level 7
  null, // Level 8
  null  // Level 9
];
const container=document.getElementById('levels');
LEVEL_URLS.forEach((url,i)=>{
 const n=i+1,live=typeof url==='string'&&url.startsWith('https://');
 const card=document.createElement('article');card.className='level'+(live?' live':'');
 if(live){
   const logo=document.createElement('div');logo.className='mark';logo.innerHTML='GLITCH<br><b>BUSTERS</b>';card.append(logo);
 }else{
   const lock=document.createElement('div');lock.className='lock';lock.textContent='🔒';lock.setAttribute('aria-hidden','true');card.append(lock);
 }
 const title=document.createElement('div');title.className='number';title.textContent='LEVEL '+n;card.append(title);
 if(live){const a=document.createElement('a');a.className='play';a.href=url;a.textContent='▶ PLAY NOW';a.setAttribute('aria-label','Play Glitch Busters Level '+n);card.append(a)}
 else{const d=document.createElement('div');d.className='locked';d.textContent='LOCKED';card.append(d)}
 container.append(card);
});
const count=LEVEL_URLS.filter(x=>typeof x==='string'&&x.startsWith('https://')).length;
document.getElementById('status').textContent=`${count} LEVEL${count===1?'':'S'} AVAILABLE • ${9-count} LOCKED`;
// Set your published CoxArcade homepage URL below to make the Back link work directly.
const COXARCADE_HOME = '';
const back=document.getElementById('back');
if(COXARCADE_HOME){back.href=COXARCADE_HOME;}else{back.href='#';back.addEventListener('click',e=>{e.preventDefault();if(history.length>1)history.back();});}
</script></body></html>
